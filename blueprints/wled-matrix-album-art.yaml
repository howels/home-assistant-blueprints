blueprint:
  name: WLED matrix album art
  author: howels
  domain: automation
  source_url: https://github.com/howels/home-assistant-blueprints/blob/main/blueprints/wled-matrix-album-art.yaml
  description: >-
    Shows album art from one media player on one or more WLED matrices, and
    clears them when playback stops.


    Players. The primary player is used while its state is playing. Otherwise
    the fallback players are checked in the order they are entered, and the
    first one that is playing is used. Any change to a watched player restarts
    the run. The picture sent is still the active player's picture, so a
    change to another player does not replace the art.


    Panels. Each panel is sent the same picture with its own size and image
    settings. A panel with a WLED device takes the DDP host from that device's
    configuration URL, and the panel's host field is ignored. A panel without
    a device uses its host, which may be a hostname, an IP address, or a URL.
    A Colorlight receiver has no WLED device, so it uses the host field.


    Picture URL. Some players store an absolute URL, including a URL on
    another host. A picture that already starts with http:// or https:// is
    sent unchanged. Some players store a Home Assistant path such as
    /api/media_player_proxy/.... The picture URL prefix is prepended only to
    those paths. Set the prefix to the external base URL of this Home
    Assistant, for example https://ha.example.com.


    The run restarts when a watched player changes. It clears each stream,
    then sends the picture once a second while the active player stays
    playing. When playback leaves that player, the run waits five seconds.
    If no watched player is playing, the lights are put back, any stop
    preset is selected, and the streams are cleared. A new active player
    during that wait restarts the run, so the panels are not cleared between
    tracks.


    Lights. A panel with a WLED device uses that device's own light entities.
    There is no separate lights list. Turn on with the music turns those
    lights on when playback starts. Turn off with the music turns them off
    when playback stops. A panel that does both, and has a light session,
    snapshots the lights on the first playing run and restores that snapshot
    at the end, so a light is turned off only if this session turned it on.
    A later track does not take a new snapshot. Set a distinct light session
    name for each automation. A host with no WLED device has no lights to
    switch.


    Each send uses brightness 255, auto brightness, and histogram clip 0.
    Keepalive defaults to 5 seconds at 0.3 second intervals. A panel can set
    keepalive to 0, which the Pixoo automations did. 1 leaves saturation,
    contrast, and gamma unchanged. 0 leaves sharpen off. The service accepts
    saturation 0 to 2, contrast 0.5 to 2, sharpen 0 to 2, and gamma 0.1 to 3.


    Recorded settings from the previous per-panel automations. One automation
    can carry a whole group because the picture prefix is shared and each
    panel keeps its own numbers.


    Matrices. Primary media_player.meraki_mx64, then
    media_player.study_amplifier_4, then media_player.study_amplifier.
    wled-hub75.example is 64 by 64, saturation 1.2, contrast 0.9, sharpen 0.5,
    gamma 0.5. Turn on with the music is off. Turn off with the music is on.
    The study player automation used contrast 1.4 and gamma 0.7 on that panel.
    wled-matrix-portal-s3.example uses the same image settings and the same
    light switches. wled-matrix-portal-s3-2.example is 128 by 128, saturation
    1.2, contrast 1.1, sharpen 0.5, gamma 0.6, and both light switches are on.
    nanopi-r3s.example is the same 128 by 128 image settings and is entered as a
    host, so it has no WLED lights to switch.


    Pixoo in the living room. Primary media_player.living_room_audio_2, then
    media_player.plex_plex_for_android_tv_bravia_vh2.
    wled-pixoo64-2.example is 64 by 64, saturation 1.2, contrast 1.6, sharpen
    0.5, gamma 1.2, keepalive 0. The Plex automation used contrast 1.1. Both
    light switches are off.


    Pixoo in the kitchen. media_player.kitchen_audio_2 only.
    wled-pixoo64-1.example is 64 by 64, saturation 1.3, contrast 1.4, sharpen
    0.2, gamma 1.2, keepalive 0. Both light switches are on.
  input:
    player_section:
      name: Players
      icon: mdi:speaker
      collapsed: false
      input:
        primary_player:
          name: Primary player
          description: >-
            Used while its state is playing. Fallback players are used, in
            the order they are entered, only when this player is not playing.
          selector:
            entity:
              filter:
                - domain: media_player
        fallback_players:
          name: Fallback players
          description: >-
            Checked in list order when the primary player is not playing. The
            first one whose state is playing supplies the picture.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
        picture_url_prefix:
          name: Picture URL prefix
          description: >-
            Prepended when entity_picture does not already start with http://
            or https://. An absolute URL, including one on another host, is
            sent unchanged. Use the external base URL of this Home Assistant,
            for example https://ha.example.com.
          default: ""
          selector:
            text: {}
        session_name:
          name: Light session name
          description: >-
            Names the scene that stores the lights before they are turned on.
            Use a different name for each automation, for example matrices.
          default: album_art
          selector:
            text: {}
        light_session:
          name: Light session
          description: >-
            Input boolean for that scene. Off means idle. The first playing
            run snapshots lights on panels that both turn on and turn off
            with the music, then turns this on. When playback has stopped,
            the snapshot is restored and this is turned off. Leave empty and
            those lights are turned off at the end of the run instead of
            restored.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_boolean
        clear_before_send:
          name: Clear before sending
          description: >-
            Stop the DDP stream and clear the panel before the first picture
            of a run. The existing automations do this.
          default: true
          selector:
            boolean: {}
    panel_section:
      name: Panels
      icon: mdi:view-grid
      collapsed: false
      input:
        panels:
          name: Panels
          description: >-
            One entry per matrix. A WLED device supplies the DDP host from
            its configuration URL and the host field is ignored. Without a
            device, set the host. Width, height, and the image fields default
            to 64, 64, saturation 1.2, contrast 0.9, sharpen 0.5, and gamma 0.5.
          selector:
            object:
              multiple: true
              label_field: name
              description_field: host
              fields:
                name:
                  label: Name
                  required: true
                  selector:
                    text:
                device:
                  label: WLED device
                  selector:
                    device:
                      integration: wled
                host:
                  label: DDP host
                  selector:
                    text:
                width:
                  label: Width
                  default: 64
                  selector:
                    number:
                      min: 1
                      max: 512
                      step: 1
                      mode: box
                height:
                  label: Height
                  default: 64
                  selector:
                    number:
                      min: 1
                      max: 512
                      step: 1
                      mode: box
                segment:
                  label: Segment ID
                  default: 0
                  selector:
                    number:
                      min: 0
                      max: 32
                      step: 1
                      mode: box
                saturation:
                  label: Saturation
                  default: 1.2
                  selector:
                    number:
                      min: 0
                      max: 2
                      step: 0.1
                      mode: box
                contrast:
                  label: Contrast
                  default: 0.9
                  selector:
                    number:
                      min: 0.5
                      max: 2
                      step: 0.1
                      mode: box
                sharpen:
                  label: Sharpen
                  default: 0.5
                  selector:
                    number:
                      min: 0
                      max: 2
                      step: 0.1
                      mode: box
                gamma:
                  label: Gamma
                  default: 0.5
                  selector:
                    number:
                      min: 0.1
                      max: 3
                      step: 0.1
                      mode: box
                keepalive:
                  label: Keepalive seconds
                  default: 5
                  selector:
                    number:
                      min: 0
                      max: 600
                      step: 1
                      mode: box
                turn_on:
                  label: Turn on with the music
                  default: true
                  selector:
                    boolean: {}
                turn_off:
                  label: Turn off with the music
                  default: true
                  selector:
                    boolean: {}

triggers:
  - trigger: state
    entity_id: !input primary_player
  - trigger: state
    entity_id: !input fallback_players

variables:
  primary: !input primary_player
  fallbacks: !input fallback_players
  prefix: !input picture_url_prefix
  panels: !input panels
  session_name: !input session_name
  light_session: !input light_session
  clear_before_send: !input clear_before_send
  active: >-
    {% set players = [primary] + (fallbacks | default([]) | list) %}
    {% set ns = namespace(active='') %}
    {% for p in players if p %}
      {% if ns.active == '' and is_state(p, 'playing') %}
        {% set ns.active = p %}
      {% endif %}
    {% endfor %}
    {{ ns.active }}
  targets: >-
    {% set ns = namespace(items=[]) %}
    {% for raw in panels %}
      {% set device = (raw.device | default('', true) | string).strip() %}
      {% set host = '' %}
      {% if device %}
        {% set url = device_attr(device, 'configuration_url') or '' %}
        {% if url %}
          {% set host = url.split('://', 1)[-1].split('/', 1)[0] %}
          {% if ':' in host and not host.startswith('[') %}
            {% set host = host.split(':', 1)[0] %}
          {% endif %}
        {% endif %}
      {% else %}
        {% set host = (raw.host | default('', true) | string).strip() %}
        {% if '://' in host %}
          {% set host = host.split('://', 1)[-1] %}
        {% endif %}
        {% set host = host.split('/', 1)[0] %}
        {% if ':' in host and not host.startswith('[') %}
          {% set host = host.split(':', 1)[0] %}
        {% endif %}
      {% endif %}
      {% set lights = namespace(items=[]) %}
      {% if device %}
        {% for entity in device_entities(device) %}
          {% if entity.startswith('light.') %}
            {% set lights.items = lights.items + [entity] %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {% set missing = 1 if host | length == 0 else 0 %}
      {% set ns.items = ns.items + [{
        'name': raw.name | default(host, true),
        'host': host,
        'width': raw.width | default(64) | int,
        'height': raw.height | default(64) | int,
        'segment': raw.segment | default(0) | int,
        'saturation': raw.saturation | default(1.2) | float,
        'contrast': raw.contrast | default(0.9) | float,
        'sharpen': raw.sharpen | default(0.5) | float,
        'gamma': raw.gamma | default(0.5) | float,
        'keepalive': raw.keepalive | default(5) | int,
        'lights': lights.items,
        'turn_on': raw.turn_on | default(true),
        'turn_off': raw.turn_off | default(true),
        'missing': missing
      }] %}
    {% endfor %}
    {{ ns.items }}

actions:
  - if:
      - condition: template
        value_template: "{{ targets | length == 0 }}"
    then:
      - stop: Add at least one panel
        error: true
  - if:
      - condition: template
        value_template: "{{ targets | selectattr('missing') | list | count > 0 }}"
    then:
      - stop: A panel needs a WLED device with a configuration URL, or a DDP host
        error: true
  - if:
      - condition: template
        value_template: "{{ active | length > 0 }}"
    then:
      - variables:
          turn_on_lights: >-
            {% set ns = namespace(items=[]) %}
            {% for t in targets if t.turn_on and t.turn_off %}
              {% for light in t.lights %}
                {% set ns.items = ns.items + [light] %}
              {% endfor %}
            {% endfor %}
            {{ ns.items | unique | list }}
      - if:
          - condition: template
            value_template: >-
              {{ turn_on_lights | length > 0 and light_session | length > 0
                 and is_state(light_session, 'off') }}
        then:
          - action: scene.create
            data:
              scene_id: "album_art_lights_{{ session_name | slugify }}"
              snapshot_entities: "{{ turn_on_lights }}"
          - action: input_boolean.turn_on
            target:
              entity_id: "{{ light_session }}"
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ repeat.item.turn_on and repeat.item.lights | length > 0 }}"
              then:
                - action: light.turn_on
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item.lights }}"
      - if:
          - condition: template
            value_template: "{{ clear_before_send }}"
        then:
          - repeat:
              for_each: "{{ targets }}"
              sequence:
                - action: ha_ddp2wled.stop_ddp_stream
                  continue_on_error: true
                  data:
                    clear_display: true
                    wled_host: "{{ repeat.item.host }}"
      - repeat:
          while:
            - condition: template
              value_template: "{{ active | length > 0 and is_state(active, 'playing') }}"
          sequence:
            - variables:
                picture_url: >-
                  {% set picture = state_attr(active, 'entity_picture') or '' %}
                  {% if picture.startswith('http://') or picture.startswith('https://') %}
                    {{ picture }}
                  {% elif picture %}
                    {{ prefix }}{{ picture }}
                  {% endif %}
            - if:
                - condition: template
                  value_template: "{{ picture_url | trim | length > 0 }}"
              then:
                - repeat:
                    for_each: "{{ targets }}"
                    sequence:
                      - action: ha_ddp2wled.send_to_wled_ddp
                        continue_on_error: true
                        data:
                          segment_id: "{{ repeat.item.segment }}"
                          timeout: 10
                          brightness: 255
                          auto_bright: true
                          clip_hist_percent: 0
                          keepalive_seconds: "{{ repeat.item.keepalive }}"
                          keepalive_interval: 0.3
                          image_url: "{{ picture_url }}"
                          wled_host: "{{ repeat.item.host }}"
                          width: "{{ repeat.item.width }}"
                          height: "{{ repeat.item.height }}"
                          saturation: "{{ repeat.item.saturation }}"
                          contrast: "{{ repeat.item.contrast }}"
                          sharpen: "{{ repeat.item.sharpen }}"
                          gamma: "{{ repeat.item.gamma }}"
            - delay:
                seconds: 1
      - delay:
          seconds: 5
      - variables:
          still_active: >-
            {% set players = [primary] + (fallbacks | default([]) | list) %}
            {% set ns = namespace(active='') %}
            {% for p in players if p %}
              {% if ns.active == '' and is_state(p, 'playing') %}
                {% set ns.active = p %}
              {% endif %}
            {% endfor %}
            {{ ns.active }}
      - if:
          - condition: template
            value_template: "{{ still_active | trim | length == 0 }}"
        then:
          - sequence:
              - sequence: &release_panels
                  - if:
                      - condition: template
                        value_template: "{{ light_session | length > 0 and is_state(light_session, 'on') }}"
                    then:
                      - action: scene.turn_on
                        continue_on_error: true
                        target:
                          entity_id: "scene.album_art_lights_{{ session_name | slugify }}"
                      - action: input_boolean.turn_off
                        continue_on_error: true
                        target:
                          entity_id: "{{ light_session }}"
                    else:
                      - repeat:
                          for_each: "{{ targets }}"
                          sequence:
                            - if:
                                - condition: template
                                  value_template: >-
                                    {{ repeat.item.turn_on and repeat.item.turn_off
                                       and repeat.item.lights | length > 0 }}
                              then:
                                - action: light.turn_off
                                  continue_on_error: true
                                  target:
                                    entity_id: "{{ repeat.item.lights }}"
                  - repeat:
                      for_each: "{{ targets }}"
                      sequence:
                        - if:
                            - condition: template
                              value_template: >-
                                {{ repeat.item.turn_off and not repeat.item.turn_on
                                   and repeat.item.lights | length > 0 }}
                          then:
                            - action: light.turn_off
                              continue_on_error: true
                              target:
                                entity_id: "{{ repeat.item.lights }}"
                        - action: ha_ddp2wled.stop_ddp_stream
                          continue_on_error: true
                          data:
                            clear_display: true
                            wled_host: "{{ repeat.item.host }}"
    else:
      - delay:
          seconds: 5
      - variables:
          still_active: >-
            {% set players = [primary] + (fallbacks | default([]) | list) %}
            {% set ns = namespace(active='') %}
            {% for p in players if p %}
              {% if ns.active == '' and is_state(p, 'playing') %}
                {% set ns.active = p %}
              {% endif %}
            {% endfor %}
            {{ ns.active }}
      - if:
          - condition: template
            value_template: "{{ still_active | trim | length == 0 }}"
        then:
          - sequence: *release_panels

mode: restart
