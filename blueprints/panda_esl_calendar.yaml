blueprint:
  name: PANDA ESL calendar agenda
  author: howels
  domain: automation
  source_url: https://github.com/howels/home-assistant-blueprints/blob/main/blueprints/panda_esl_calendar.yaml
  description: >-
    Draws the coming events of one or more Home Assistant calendars on a PANDA
    / ETAG Bluetooth e-paper label. Requires the PANDA ESL integration
    (https://github.com/moryoav/ha-panda).


    Any calendar entity works, including the Google Calendar integration, which
    creates one calendar entity per Google calendar. calendar.get_events is
    called once for all selected calendars, from now until the end of the last
    day selected. The events of all calendars are merged and sorted by start
    time. Each row has a time column and the event summary. Events that start
    today are drawn in red. The time column shows the time for events today,
    Tom and the time for tomorrow, and the weekday and time for later days.
    All-day events show Today, Tomorrow, or the weekday. An event in progress
    shows Now. When more events exist than rows fit, the last row reads "+N
    more".


    The automation runs at Home Assistant start, when a calendar entity changes
    state, and on the selected interval. A calendar entity changes state when an
    event starts or ends, so the label drops finished events and shows the new
    event at those times. A state change starts a wait of the settle time. The
    write action and the dry run input behave as in the PANDA ESL weather
    display blueprint.


    Icon style emoji draws OpenMoji pictures for the header glyph and the
    markers. Emoji in the text are drawn the same way, up to three before each
    row. Each picture is a PNG that the integration downloads from the emoji
    image URL at every write, through the dlimg element. The renderer reduces
    the label to black, white, and red, so the red parts of a colour emoji stay
    red, the outlines turn black, and light fills turn white. Yellow is not
    available on this hardware and is drawn as red. Replace color with black in
    the URL for an all-black set. Copy the OpenMoji PNG folder to the Home
    Assistant host, or serve it from config/www, to avoid the download. Put
    {code} in the URL where the upper-case hexadecimal code point belongs.
    OpenMoji is licensed CC BY-SA 4.0. The text font has no emoji glyphs, so
    the text is drawn with its emoji removed.
  input:
    display_section:
      name: Display
      icon: mdi:tag-text
      collapsed: false
      input:
        display:
          name: PANDA ESL label
          description: Label that receives the image.
          selector:
            device:
              integration: panda_esl
        display_size:
          name: Resolution
          description: >-
            Resolution of the label. ETAG-525 is 256 by 128, ETAG-526 is 296 by
            152, ETAG-530 is 360 by 240, and ETAG-534 is 400 by 300.
          default: 360x240
          selector:
            select:
              mode: dropdown
              options:
                - label: 256 x 128 (ETAG-525, 2.13 inch)
                  value: 256x128
                - label: 296 x 152 (ETAG-526, 2.66 inch)
                  value: 296x152
                - label: 360 x 240 (ETAG-530, 3.5 inch)
                  value: 360x240
                - label: 400 x 300 (ETAG-534, 4.2 inch)
                  value: 400x300
        write_action:
          name: Write action
          description: >-
            panda_esl.write_guarded applies the duplicate prevention, write
            lock, and debounce options of the integration. panda_esl.write
            always sends.
          default: panda_esl.write_guarded
          selector:
            select:
              mode: dropdown
              options:
                - label: Guarded write
                  value: panda_esl.write_guarded
                - label: Write
                  value: panda_esl.write
        dry_run:
          name: Dry run
          description: >-
            Renders to the Preview content image entity and does not send
            Bluetooth packets.
          default: false
          selector:
            boolean: {}
    calendar_section:
      name: Calendars
      icon: mdi:calendar-month
      collapsed: false
      input:
        calendars:
          name: Calendars
          description: Calendars whose events are drawn.
          selector:
            entity:
              multiple: true
              filter:
                - domain: calendar
        title:
          name: Title
          description: Header text.
          default: Calendar
          selector:
            text: {}
        days_ahead:
          name: Days ahead
          description: >-
            Days after today to include. 0 draws today only.
          default: 3
          selector:
            number:
              min: 0
              max: 14
              step: 1
              mode: box
        max_items:
          name: Maximum events
          description: >-
            Upper limit on the rows. The resolution also limits the rows. The
            3.5 inch label fits 7 rows including the "+N more" row.
          default: 8
          selector:
            number:
              min: 1
              max: 12
              step: 1
              mode: box
        update_minutes:
          name: Update interval
          description: >-
            How often the label is refreshed, in addition to every event start
            and end. Each refresh redraws the e-paper panel.
          default: "0"
          selector:
            select:
              mode: dropdown
              options:
                - label: Every hour
                  value: "0"
                - label: Every 30 minutes
                  value: /30
        settle_seconds:
          name: Settle time
          description: >-
            Wait after a calendar state change before the write. A further
            change in that time restarts the wait.
          default: 30
          selector:
            number:
              min: 0
              max: 600
              step: 5
              unit_of_measurement: s
              mode: box
    style_section:
      name: Style
      icon: mdi:palette
      collapsed: true
      input:
        icon_style:
          name: Icon style
          description: >-
            mdi draws a bundled Material Design Icon in the header. emoji draws
            an OpenMoji picture.
          default: mdi
          selector:
            select:
              mode: dropdown
              options:
                - label: Material Design Icons
                  value: mdi
                - label: Emoji
                  value: emoji
        emoji_image_url:
          name: Emoji image URL
          description: >-
            Address of one emoji PNG. {code} is replaced with the upper-case
            hexadecimal code point, for example 2600 for the sun. A file path
            works in the same form.
          default: https://cdn.jsdelivr.net/gh/hfg-gmuend/openmoji@15.1.0/color/72x72/{code}.png
          selector:
            text: {}
        emoji_mode:
          name: Emoji in text
          description: >-
            image draws up to three emoji from each row as pictures before the
            text. strip draws the text only. The emoji image URL must be
            reachable in image mode, or the write fails.
          default: image
          selector:
            select:
              mode: dropdown
              options:
                - label: Pictures
                  value: image
                - label: Strip
                  value: strip
        text_font:
          name: Text font
          description: Regular weight font for the summaries.
          default: fonts/NotoSansKR-Regular.ttf
          selector:
            text: {}
        bold_font:
          name: Bold font
          description: Bold weight font for the header and the time column.
          default: fonts/NotoSansKR-Bold.ttf
          selector:
            text: {}

variables:
  emoji_mode: !input emoji_mode
  emoji_image_url: !input emoji_image_url
  supported_emoji: "[\u231A-\u231B\u23E9-\u23F3\u23F8-\u23FA\u2600-\u2605\u260E\u2611\u2614-\u2615\u2618\u261D\u2620\u2622-\u2623\u2626\u262A\u262E-\u262F\u2638-\u263A\u2640\u2642\u2648-\u2653\u265F-\u2660\u2663\u2665-\u2666\u2668\u267B\u267E-\u267F\u2692-\u2697\u2699\u269B-\u269C\u26A0-\u26A1\u26A7\u26AA-\u26AB\u26B0-\u26B1\u26BD-\u26BE\u26C4-\u26C5\u26C8\u26CE-\u26CF\u26D1\u26D3-\u26D4\u26E9-\u26EA\u26F0-\u26F5\u26F7-\u26FA\u26FD\u2702\u2705\u2708-\u270D\u270F\u2712\u2714\u2716\u271D\u2721\u2728\u2733-\u2734\u2744\u2747\u274C\u274E\u2753-\u2755\u2757\u2763-\u2764\u2795-\u2797\u27A1\u27B0\u27BF\u2B05-\u2B07\u2B1B-\u2B1C\u2B50\u2B55\U0001F004\U0001F0CF\U0001F10D-\U0001F10F\U0001F12F\U0001F16D-\U0001F171\U0001F17E-\U0001F17F\U0001F18E\U0001F191-\U0001F19A\U0001F201-\U0001F202\U0001F21A\U0001F22F\U0001F232-\U0001F23A\U0001F250-\U0001F251\U0001F260-\U0001F265\U0001F300-\U0001F321\U0001F324-\U0001F393\U0001F396-\U0001F397\U0001F399-\U0001F39B\U0001F39E-\U0001F3F0\U0001F3F3-\U0001F3F5\U0001F3F7-\U0001F3FA\U0001F400-\U0001F4FD\U0001F4FF-\U0001F53D\U0001F549-\U0001F54E\U0001F550-\U0001F567\U0001F56F-\U0001F570\U0001F573-\U0001F57A\U0001F587\U0001F58A-\U0001F58D\U0001F590\U0001F595-\U0001F596\U0001F5A4-\U0001F5A5\U0001F5A8\U0001F5B1-\U0001F5B2\U0001F5BC\U0001F5C2-\U0001F5C4\U0001F5D1-\U0001F5D3\U0001F5DC-\U0001F5DE\U0001F5E1\U0001F5E3\U0001F5E8\U0001F5EF\U0001F5F3\U0001F5FA-\U0001F64F\U0001F680-\U0001F6C5\U0001F6CB-\U0001F6D2\U0001F6D5-\U0001F6D7\U0001F6DC-\U0001F6E5\U0001F6E9\U0001F6EB-\U0001F6EC\U0001F6F0\U0001F6F3-\U0001F6FC\U0001F7E0-\U0001F7EB\U0001F7F0\U0001F90C-\U0001F93A\U0001F93C-\U0001F945\U0001F947-\U0001F9FF\U0001FA70-\U0001FA7C\U0001FA80-\U0001FA88\U0001FA90-\U0001FABD\U0001FABF-\U0001FAC5\U0001FACE-\U0001FADB\U0001FAE0-\U0001FAE8\U0001FAF0-\U0001FAF8]"
  strip_pattern: "[\u2600-\u27BF\u2B00-\u2BFF\U0001F000-\U0001FAFF\uFE0F\u200D\u20E3]"
  title: !input title
  display_size: !input display_size
  days_ahead: !input days_ahead
  max_items: !input max_items
  icon_style: !input icon_style
  use_emoji: "{{ icon_style == 'emoji' }}"
  text_font: !input text_font
  bold_font: !input bold_font

triggers:
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id: !input calendars
    id: change
  - trigger: time_pattern
    minutes: !input update_minutes

actions:
  - if:
      - condition: trigger
        id: change
    then:
      - delay:
          seconds: !input settle_seconds
  - action: calendar.get_events
    target:
      entity_id: !input calendars
    data:
      start_date_time: "{{ now().isoformat() }}"
      end_date_time: "{{ (today_at() + timedelta(days=(days_ahead | int) + 1)).isoformat() }}"
    response_variable: calendar_response
  - variables:
      W: "{{ display_size.split('x')[0] | int }}"
      H: "{{ display_size.split('x')[1] | int }}"
      events: >-
        {% set ns = namespace(rows=[]) %}
        {% for entity, body in (calendar_response | default({}, true)).items() %}
          {% for e in (body or {}).get('events') or [] %}
            {% set all_day = (e.start | string) | length == 10 %}
            {% set s = as_local(as_datetime(e.start ~ ' 00:00:00' if all_day else e.start)) %}
            {% set days = [(s.date() - now().date()).days, 0] | max %}
            {% if all_day %}
              {% set label = 'Today' if days == 0 else ('Tomorrow' if days == 1 else s.strftime('%a')) %}
            {% elif s <= now() %}
              {% set label = 'Now' %}
            {% elif days == 0 %}
              {% set label = s.strftime('%H:%M') %}
            {% elif days == 1 %}
              {% set label = 'Tom ' ~ s.strftime('%H:%M') %}
            {% else %}
              {% set label = s.strftime('%a %H:%M') %}
            {% endif %}
            {% set raw = e.get('summary') or '' %}
            {% set ns.rows = ns.rows + [{
              'ts': as_timestamp(s), 'label': label, 'today': days == 0,
              'raw': raw, 'summary': (raw | regex_replace(strip_pattern, '') | regex_replace('\\s{2,}', ' ')) | trim
            }] %}
          {% endfor %}
        {% endfor %}
        {{ ns.rows | sort(attribute='ts') }}
      pad: "{{ (W * 0.03) | round(0) | int }}"
      header_h: "{{ (H * 0.13) | round(0) | int }}"
      header_size: "{{ (header_h * 0.62) | round(0) | int }}"
      glyph_size: "{{ (header_h * 0.74) | round(0) | int }}"
      row_h: "{{ (H * 0.12) | round(0) | int }}"
      size: "{{ (row_h * 0.66) | round(0) | int }}"
      emoji_size: "{{ (row_h * 0.8) | round(0) | int }}"
      body_top: "{{ header_h + 3 }}"
      fit: "{{ ((H - body_top) / row_h) | int }}"
      rows: "{{ [fit, max_items | int] | min }}"
      overflow: "{{ events | count > rows }}"
      shown: "{{ rows - 1 if overflow else rows }}"
      label_chars: >-
        {{ [events[:shown] | map(attribute='label') | map('length') | max, 4] | max if events | count > 0 else 4 }}
      text_x: "{{ (pad + (label_chars + 1) * 0.56 * size) | round(0) | int }}"
      max_chars: "{{ ((W - text_x - pad) / (0.5 * size)) | int }}"
      date_text: "{{ now().strftime('%a %d %b') }}"
      payload: >-
        {% set ns = namespace(p=[]) %}
        {% set ns.p = ns.p + [{
          'type': 'rectangle', 'x_start': 0, 'y_start': 0, 'x_end': W - 1, 'y_end': header_h,
          'fill': 'black', 'outline': 'black'
        }] %}
        {% if use_emoji %}
          {% set gy = ((header_h - glyph_size) / 2) | round(0) | int %}
          {% set ns.p = ns.p + [{
            'type': 'rectangle', 'x_start': pad, 'y_start': gy, 'x_end': pad + glyph_size,
            'y_end': gy + glyph_size, 'fill': 'white', 'outline': 'white'
          }, {
            'type': 'dlimg', 'url': emoji_image_url.replace('{code}', '1F4C5'), 'x': pad, 'y': gy,
            'xsize': glyph_size, 'ysize': glyph_size
          }] %}
        {% else %}
          {% set ns.p = ns.p + [{
            'type': 'icon', 'value': 'calendar-month', 'x': pad + (glyph_size / 2) | round(0) | int,
            'y': (header_h / 2) | round(0) | int, 'size': glyph_size, 'color': 'white', 'anchor': 'mm'
          }] %}
        {% endif %}
        {% set title_max = ((W - 2 * pad - glyph_size - ((date_text | length) + 2) * 0.55 * header_size) / (0.6 * header_size)) | int %}
        {% set ns.p = ns.p + [{
          'type': 'text', 'value': title if title | length <= title_max else title[:title_max - 1] ~ '…',
          'x': pad + glyph_size + pad, 'y': (header_h / 2) | round(0) | int, 'size': header_size,
          'color': 'white', 'anchor': 'lm', 'font': bold_font
        }, {
          'type': 'text', 'value': date_text, 'x': W - pad, 'y': (header_h / 2) | round(0) | int,
          'size': header_size, 'color': 'white', 'anchor': 'rm', 'font': text_font
        }] %}
        {% if events | count == 0 %}
          {% if use_emoji %}
            {% set es = (H * 0.30) | round(0) | int %}
            {% set ns.p = ns.p + [{
              'type': 'dlimg', 'url': emoji_image_url.replace('{code}', '1F4C5'), 'x': ((W - es) / 2) | round(0) | int,
              'y': (header_h + (H - header_h) * 0.40 - es / 2) | round(0) | int,
              'xsize': es, 'ysize': es
            }] %}
          {% else %}
            {% set ns.p = ns.p + [{
              'type': 'icon', 'value': 'calendar-check', 'x': (W / 2) | round(0) | int,
              'y': (header_h + (H - header_h) * 0.40) | round(0) | int,
              'size': (H * 0.30) | round(0) | int, 'color': 'black', 'anchor': 'mm'
            }] %}
          {% endif %}
          {% set ns.p = ns.p + [{
            'type': 'text', 'value': 'No events', 'x': (W / 2) | round(0) | int,
            'y': (header_h + (H - header_h) * 0.80) | round(0) | int,
            'size': (size * 1.2) | round(0) | int, 'color': 'black', 'anchor': 'mm', 'font': bold_font
          }] %}
        {% endif %}
        {% for ev in events[:shown] %}
          {% set y = (body_top + (loop.index0 + 0.5) * row_h) | round(0) | int %}
          {% set summary = ev.summary %}
          {% set ems = (ev.raw | regex_findall(supported_emoji))[:3] if emoji_mode == 'image' else [] %}
          {% set tx = text_x + ems | count * (emoji_size + 3) %}
          {% set mc = ((W - tx - pad) / (0.5 * size)) | int %}
          {% set ns.p = ns.p + [{
            'type': 'text', 'value': ev.label, 'x': pad, 'y': y, 'size': size,
            'color': 'red' if ev.today else 'black', 'anchor': 'lm', 'font': bold_font
          }, {
            'type': 'text', 'value': summary if summary | length <= mc else summary[:mc - 1] ~ '…',
            'x': tx, 'y': y, 'size': size, 'color': 'black', 'anchor': 'lm', 'font': text_font
          }] %}
          {% for ch in ems %}
            {% set ns.p = ns.p + [{
              'type': 'dlimg', 'url': emoji_image_url.replace('{code}', ch.encode('utf-32-be').hex() | upper | regex_replace('^0+', '')),
              'x': text_x + loop.index0 * (emoji_size + 3),
              'y': y - (emoji_size / 2) | round(0) | int, 'xsize': emoji_size, 'ysize': emoji_size
            }] %}
          {% endfor %}
        {% endfor %}
        {% if overflow %}
          {% set ns.p = ns.p + [{
            'type': 'text', 'value': '+' ~ (events | count - shown) ~ ' more', 'x': pad,
            'y': (body_top + (shown + 0.5) * row_h) | round(0) | int, 'size': size,
            'color': 'red', 'anchor': 'lm', 'font': bold_font
          }] %}
        {% endif %}
        {{ ns.p }}
  - action: !input write_action
    target:
      device_id: !input display
    data:
      background: white
      dry_run: !input dry_run
      payload: "{{ payload }}"

mode: restart
