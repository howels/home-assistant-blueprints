blueprint:
  name: ZHA - Lutron Aurora Dimmer - Toggle v1.1
  author: howels
  description: >-
    Control lights with a Lutron Aurora dimmer. Pressing the dimmer button
    toggles the lights. Rotating the dimmer sets the brightness to the level
    the dimmer reports.


    The dimmer sends an absolute level from 0 to 254 with each rotation event.
    Each event restarts the run, so only the most recent level is sent to the
    lights and a burst of events never queues. Only the move_to_level_with_on_off
    command from the dimmer triggers the automation. Other events from the
    device do not restart a run that is in progress.


    Sensitivity quantises the level before it is sent. Sensitivity 3 sends 255
    distinct brightness levels, 2 sends 52 (steps of 5) and 1 sends 18 (steps
    of 15). Every setting keeps more than 10 steps across the range.


    Based on the work of bjpetit.
  domain: automation
  input:
    remote:
      name: Lutron Aurora Dimmer Switch
      description: Lutron Aurora Z3-1BRL
      selector:
        device:
          integration: zha
          manufacturer: Aurora
          model: 2GBatteryDimmer50AU
          entity:
            - domain:
                - sensor
              device_class:
                - battery
          multiple: false
    light:
      name: Light(s)
      description: The light(s) to control
      selector:
        target:
          entity:
            - domain:
                - light
    sensitivity:
      name: Sensitivity
      description: >-
        3 sends every level the dimmer reports. 2 rounds the level to the
        nearest 5 and 1 to the nearest 15. Lower values send fewer distinct
        brightness levels.
      default: 3
      selector:
        number:
          min: 1.0
          max: 3.0
          mode: slider
          step: 1.0
    transition:
      name: Brightness transition
      description: >-
        Seconds the light takes to reach each new brightness. A short
        transition smooths the steps at lower sensitivities. Set 0 for the
        fastest response.
      default: 0.2
      selector:
        number:
          min: 0.0
          max: 2.0
          mode: slider
          step: 0.1
          unit_of_measurement: s
  source_url: https://github.com/howels/home-assistant-blueprints/blob/main/blueprints/zha_lutron_aurora_dimmer_toggle.yaml
mode: restart
max_exceeded: silent
triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: move_to_level_with_on_off
variables:
  sensitivity_input: !input sensitivity
  transition: !input transition
  selected_light: !input light
  quantum: "{{ {1: 15, 2: 5}.get(sensitivity_input | int(3), 1) }}"
  args: "{{ trigger.event.data.args | default([]) }}"
  level: "{{ args[0] | int(0) if args | length > 0 else 0 }}"
  presstype: "{{ args[1] | int(0) if args | length > 1 else 0 }}"
  brightness: "{{ [[(level / quantum) | round(0) * quantum, 255] | min, 0] | max | int }}"
actions:
  - choose:
      - conditions: "{{ presstype == 2 }}"
        sequence:
          - action: light.turn_on
            target: "{{ selected_light }}"
            data:
              brightness: "{{ brightness }}"
              transition: "{{ transition }}"
      - conditions: "{{ presstype == 7 }}"
        sequence:
          - action: light.toggle
            target: "{{ selected_light }}"
