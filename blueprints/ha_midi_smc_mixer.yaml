      name: Advanced
      icon: mdi:cog
      collapsed: true
      description: Settings that the defaults already cover for the ha-midi bridge.
      input:
        topic_prefix:
          name: Topic prefix
          description: >-
            MQTT topic prefix of the mixer, for example
            ha-midi/ha-midi-bridge/sincosinco_smc_mixer_master_161. Leave empty
            to derive it from the device identifier.
          default: ""
          selector:
            text:
        state_topic_filter:
          name: State topic filter
          description: >-
            MQTT filter that matches the state topics of every bridge device.
            The blueprint ignores topics outside the selected device. The first
            level is also the root of the derived topic prefix.
          default: ha-midi/+/+/+/state
          selector:
            text:
        fader_debounce:
          name: Fader sampling interval
          description: >-
            Milliseconds between light updates while a fader moves, and the
            time a fader must stay still before a volume ramp starts. Each
            fader message waits for the next interval boundary and acts only if
            it is still the latest position, so a moving fader sends at most
            one light command per interval. Raise it for slow lights.
          default: 100
          selector:
            number:
              min: 20
              max: 1000
              step: 10
              mode: box
              unit_of_measurement: ms
        dial_debounce:
          name: Dial sampling interval
          description: >-
            Milliseconds between light updates while a dial turns. Each dial
            message waits for the next interval boundary and acts only if no
            newer event has arrived, so a spinning dial sends at most one light
            command per interval and waits for slow lights such as WLED to
            report their updated state before stepping again.
          default: 250
          selector:
            number:
              min: 50
              max: 1000
              step: 10
              mode: box
              unit_of_measurement: ms
        log_events:
          name: Log events
          description: >-
            Write the control name and value of each mixer event to the system
            log. Use it to check that Fader 1 and Dial 1 are the controls
            expected.
          default: false
          selector:
            boolean:
mode: parallel
max: 60
max_exceeded: silent
triggers:
  - trigger: mqtt
    id: midi
    topic: !input state_topic_filter
  - trigger: mqtt
    id: sync_bridge
    topic: ha-midi/+/+/availability
    payload: online
  - trigger: homeassistant
    id: sync_start
    event: start
  - trigger: state
    id: led_media
    entity_id: !input media_players
    to:
  - trigger: state
    id: led_media
    entity_id: !input media_players
    attribute: is_volume_muted
  - trigger: state
    id: led_media
    entity_id: !input record_media_players
    to:
