blueprint:
  name: HA-MIDI - M-VAVE SMC-Mixer
  author: howels
  source_url: https://github.com/howels/home-assistant-blueprints/blob/main/blueprints/ha_midi_smc_mixer.yaml
  description: >-
    Control lights and media players with an M-VAVE SMC-Mixer connected through
    the ha-midi bridge.


    The bridge publishes the mixer to MQTT in Mackie Control (DAW mode)
    layout. This blueprint reads those topics and gives each control a fixed
    name. It does not use the MQTT entity names.


    **Faders 1 to 8** (`pb_0` to `pb_7`). A fader sets the brightness, colour
    temperature, hue or saturation of lights, or the volume of media players.
    A rising volume ramps at the rise rate and a falling volume at the fall
    rate. The fall rate is the larger, so a quick pull down is immediate and a
    push up is gradual. A newer fader movement replaces a ramp in progress.
    A fader sends a message for each step, faster than lights and players
    follow. A light fader sends at most one command per sampling interval.
    A volume ramp starts when the fader has been still for that interval.


    **Dials 1 to 8** (`cc_016_00` to `cc_023_00`). A dial steps the same
    attributes by one detent per click. Volume steps are smaller going up
    than going down.


    **Strip keys.** Each column has four keys.


    | Key | Note | Lights | Media players |

    |----|----|----|----|

    | Record 1-8 | 0-7 | Night brightness | Previous track |

    | Solo 1-8 | 8-15 | Full brightness | Next track |

    | Mute 1-8 | 16-23 | Off | Mute toggle |

    | Select 1-8 | 24-31 | Toggle | Play or pause |


    **Transport keys.** These act on the media players of the media section.


    | Key | Note | Action |

    |----|----|----|

    | Rewind | 91 | Seek back |

    | Fast forward | 92 | Seek forward |

    | Stop | 93 | Pause |

    | Play | 94 | Play |

    | Record | 95 | Play or pause (record media players) |

    | Up | 96 | Volume up, in the volume step up |

    | Down | 97 | Volume down, in the volume step down |

    | Left | 98 | Previous track |

    | Right | 99 | Next track |

    | Previous 8 tracks | 46, 48 | Previous source |

    | Next 8 tracks | 47, 49 | Next source |


    **Key lights.** Play and Record light while their media players play. Stop
    lights while none plays. Select lights while a strip light is on or a strip
    media player plays. Mute lights while a strip media player is muted or all
    strip lights are off. The blueprint publishes ON and OFF to the `set` topic
    of each `button_light` entity, the topic that the light entity uses. It
    updates the key lights when Home Assistant starts and when the bridge
    reports itself online.


    Select the mixer device from the HA-MIDI bridge. Select the Master device,
    not the Private device, which repeats the same controls. The blueprint
    reads the device identifier to find the MQTT topic prefix.


    A bridge restart republishes the retained control state. A retained fader
    at zero lowers the volume at the fall rate. Turn the automation off while
    the bridge restarts, for example with
    `pause_automations_on_service_restart.yaml`.
  domain: automation
  input:
    device:
      name: Mixer device
      description: >-
        The HA-MIDI bridge device of the SMC-Mixer Master port. Its name is
        similar to HA-MIDI Bridge SINCO SMC-Mixer-Master.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: HA-MIDI
    media_section:
      name: Media players
      icon: mdi:play-pause
      collapsed: false
      description: Media players for the transport keys.
      input:
        media_players:
          name: Media players
          description: >-
            Media players for Play, Stop, Rewind, Fast forward, Left, Right,
            Up, Down and the previous and next 8 tracks keys.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
        record_media_players:
          name: Record key media players
          description: >-
            Media players that the Record key plays or pauses. When empty, the
            Record key uses the media players above.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
        seek_seconds:
          name: Seek step
          description: Seconds that Rewind and Fast forward move the position.
          default: 10
          selector:
            number:
              min: 1
              max: 120
              step: 1
              mode: box
              unit_of_measurement: s
    volume_section:
      name: Volume limits
      icon: mdi:volume-high
      collapsed: false
      description: >-
        Volume rises slowly and falls quickly. The maximum volume applies to
        every control.
      input:
        volume_rise_rate:
          name: Fader rise rate
          description: >-
            Greatest speed, in percent of full volume per second, at which a
            fader raises the volume. A fader above the volume ramps up at this
            speed.
          default: 4
          selector:
            number:
              min: 0.5
              max: 50
              step: 0.5
              mode: slider
              unit_of_measurement: "%/s"
        volume_fall_rate:
          name: Fader fall rate
          description: >-
            Greatest speed, in percent of full volume per second, at which a
            fader lowers the volume. Set it higher than the rise rate.
          default: 40
          selector:
            number:
              min: 0.5
              max: 100
              step: 0.5
              mode: slider
              unit_of_measurement: "%/s"
        volume_step_up:
          name: Volume step up
          description: >-
            Percent of full volume added by one dial detent or the Up key.
          default: 1
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.5
              mode: slider
              unit_of_measurement: "%"
        volume_step_down:
          name: Volume step down
          description: >-
            Percent of full volume removed by one dial detent or the Down key.
          default: 2
          selector:
            number:
              min: 0.5
              max: 20
              step: 0.5
              mode: slider
              unit_of_measurement: "%"
        max_volume:
          name: Maximum volume
          description: >-
            Percent of full volume that no control exceeds. A fader at the top
            sets this volume. A media player already above it is not raised
            further and can still be lowered.
          default: 100
          selector:
            number:
              min: 10
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
    light_section:
      name: Lights
      icon: mdi:lightbulb
      collapsed: true
      description: Settings for the strip lights.
      input:
        light_dial_step:
          name: Dial step for lights
          description: >-
            Percent of the range that one dial detent moves a light. The range
            is 100 percent for brightness and saturation, 360 degrees for hue
            and the light's kelvin range for colour temperature.
          default: 5
          selector:
            number:
              min: 1
              max: 25
              step: 1
              mode: slider
              unit_of_measurement: "%"
        night_brightness:
          name: Night brightness
          description: Brightness, in percent, that the Record key sets on lights.
          default: 5
          selector:
            number:
              min: 1
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
    strip_1:
      name: Strip 1
      icon: mdi:tune-vertical
      collapsed: true
      description: >-
        Fader 1, Dial 1 and the Record, Solo, Mute and Select keys of column 1.
      input:
        strip_1_targets:
          name: Strip 1 lights and media players
          description: >-
            Lights and media players controlled by Fader 1, Dial 1 and the
            four keys of column 1. Leave empty to leave the column unused.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - light
                    - media_player
        strip_1_fader:
          name: Fader 1 function
          description: Attribute that Fader 1 sets on the strip entities.
          default: auto
          selector:
            select:
              mode: dropdown
              options:
                - label: "Automatic (brightness for lights, volume for media players)"
                  value: auto
                - label: "Brightness"
                  value: brightness
                - label: "Colour temperature"
                  value: colour_temp
                - label: "Colour temperature via RGB"
                  value: colour_temp_rgb
                - label: "Hue"
                  value: hue
                - label: "Saturation"
                  value: saturation
                - label: "Volume"
                  value: volume
                - label: "Not used"
                  value: none
        strip_1_dial:
          name: Dial 1 function
