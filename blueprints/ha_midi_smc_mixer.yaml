    entity_id: !input strip_4_targets
    attribute: is_volume_muted
  - trigger: state
    id: led_strip_5
    entity_id: !input strip_5_targets
    to:
  - trigger: state
    id: led_strip_5
    entity_id: !input strip_5_targets
    attribute: is_volume_muted
  - trigger: state
    id: led_strip_6
    entity_id: !input strip_6_targets
    to:
  - trigger: state
    id: led_strip_6
    entity_id: !input strip_6_targets
    attribute: is_volume_muted
  - trigger: state
    id: led_strip_7
    entity_id: !input strip_7_targets
    to:
  - trigger: state
    id: led_strip_7
    entity_id: !input strip_7_targets
    attribute: is_volume_muted
  - trigger: state
    id: led_strip_8
    entity_id: !input strip_8_targets
    to:
  - trigger: state
    id: led_strip_8
    entity_id: !input strip_8_targets
    attribute: is_volume_muted
variables:
  bridge_device: !input device
  prefix_override: !input topic_prefix
  topic_filter: !input state_topic_filter
  media_players: !input media_players
  record_players_input: !input record_media_players
  seek_seconds: !input seek_seconds
  volume_rise_rate: !input volume_rise_rate
  volume_fall_rate: !input volume_fall_rate
  volume_step_up: !input volume_step_up
  volume_step_down: !input volume_step_down
  volume_cap: !input max_volume
  light_dial_step: !input light_dial_step
  night_brightness: !input night_brightness
  log_events: !input log_events
  fader_debounce: !input fader_debounce
  dial_debounce: !input dial_debounce
  strips:
    - targets: !input strip_1_targets
      fader: !input strip_1_fader
      dial: !input strip_1_dial
    - targets: !input strip_2_targets
      fader: !input strip_2_fader
      dial: !input strip_2_dial
    - targets: !input strip_3_targets
      fader: !input strip_3_fader
      dial: !input strip_3_dial
    - targets: !input strip_4_targets
      fader: !input strip_4_fader
      dial: !input strip_4_dial
    - targets: !input strip_5_targets
      fader: !input strip_5_fader
      dial: !input strip_5_dial
    - targets: !input strip_6_targets
      fader: !input strip_6_fader
      dial: !input strip_6_dial
    - targets: !input strip_7_targets
      fader: !input strip_7_fader
      dial: !input strip_7_dial
    - targets: !input strip_8_targets
      fader: !input strip_8_fader
      dial: !input strip_8_dial
  record_players: "{{ record_players_input if record_players_input | length > 0 else media_players }}"
  ramp_interval: 0.5
  light_functions: [brightness, colour_temp, colour_temp_rgb, hue, saturation]
  transport_keys:
    - rewind
    - fast_forward
    - stop
    - play
    - record
    - up
    - down
    - left
    - right
    - bank_prev
    - bank_next
  bridge_identifier: >-
    {% set ns = namespace(value='') %}
    {% for item in device_attr(bridge_device, 'identifiers') | default([], true) %}
    {% if item[0] == 'mqtt' %}{% set ns.value = item[1] %}{% endif %}
    {% endfor %}
    {{ ns.value }}
  bridge_prefix: >-
    {% if prefix_override | length > 0 %}
    {{ prefix_override.strip('/') }}
    {% elif '_' in bridge_identifier %}
    {{ topic_filter.split('/')[0] }}/{{ bridge_identifier.split('_', 1)[0] }}/{{ bridge_identifier.split('_', 1)[1] }}
    {% endif %}
  topic: "{{ trigger.topic | default('') }}"
  from_bridge: "{{ bridge_prefix | length > 0 and topic.startswith(bridge_prefix ~ '/') }}"
  leaf: "{{ topic[(bridge_prefix | length + 1):].split('/')[0] if from_bridge else '' }}"
  payload: "{{ trigger.payload | default('') }}"
  kind: >-
    {% if leaf.startswith('button_state_') %}button
    {% elif leaf.startswith('pb_') %}fader
    {% elif leaf.startswith('cc_') %}dial
    {% else %}other{% endif %}
  number: >-
    {% if kind == 'button' %}{{ leaf.split('_')[2] | int(-1) }}
    {% elif kind in ['fader', 'dial'] %}{{ leaf.split('_')[1] | int(-1) }}
    {% else %}-1{% endif %}
  control: >-
    {% if kind == 'fader' and 0 <= number <= 7 %}fader_{{ number + 1 }}
    {% elif kind == 'dial' and 16 <= number <= 23 %}dial_{{ number - 15 }}
    {% elif kind == 'button' and 0 <= number <= 31 %}{{ ['rec', 'solo', 'mute', 'select'][number // 8] }}_{{ number % 8 + 1 }}
    {% elif kind == 'button' %}{{ {91: 'rewind', 92: 'fast_forward', 93: 'stop', 94: 'play', 95: 'record', 96: 'up', 97: 'down', 98: 'left', 99: 'right', 46: 'bank_prev', 48: 'bank_prev', 47: 'bank_next', 49: 'bank_next'}.get(number, '') }}
    {% endif %}
  control_name: >-
    {% set part = control.split('_') %}
    {% if control.startswith('fader_') %}Fader {{ part[1] }}
    {% elif control.startswith('dial_') %}Dial {{ part[1] }}
    {% elif part[0] in ['rec', 'solo', 'mute', 'select'] %}Strip {{ part[1] }} {{ {'rec': 'Record', 'solo': 'Solo', 'mute': 'Mute', 'select': 'Select'}[part[0]] }}
    {% else %}{{ {'rewind': 'Rewind', 'fast_forward': 'Fast forward', 'stop': 'Stop', 'play': 'Play', 'record': 'Record', 'up': 'Up', 'down': 'Down', 'left': 'Left', 'right': 'Right', 'bank_prev': 'Previous 8 tracks', 'bank_next': 'Next 8 tracks'}.get(control, control) }}{% endif %}
  pressed: "{{ kind == 'button' and payload == 'ON' }}"
  strip_number: "{{ control.split('_')[-1] | int(0) }}"
  strip_key: "{{ control.split('_')[0] if strip_number > 0 and kind == 'button' else '' }}"
  strip: "{{ strips[strip_number - 1] if 1 <= strip_number <= 8 else {} }}"
  strip_targets: "{{ strip.targets | default([], true) }}"
  strip_lights: "{{ strip_targets | select('match', '^light[.]') | list }}"
  strip_players: "{{ strip_targets | select('match', '^media_player[.]') | list }}"
  fader_value: "{{ payload | float(0) }}"
  fader_entity: >-
    {{ (device_entities(bridge_device)
        | select('search', '^number[.].*_pitch_bend_channel_' ~ number ~ '$')
        | list | first | default('')) if control.startswith('fader_') else '' }}
  fader_function: "{{ strip.fader | default('none') if control.startswith('fader_') else 'none' }}"
  dial_function: "{{ strip.dial | default('none') if control.startswith('dial_') and payload | int(0) % 64 > 0 else 'none' }}"
  volume_step_dir: >-
    {% if pressed and control == 'up' %}1
    {% elif pressed and control == 'down' %}-1
    {% elif dial_function in ['auto', 'volume'] %}{{ 1 if payload | int(0) < 64 else -1 }}
    {% else %}0{% endif %}
  volume_step_ticks: "{{ payload | int(0) % 64 if control.startswith('dial_') else 1 }}"
  volume_step_players: "{{ media_players if control in ['up', 'down'] else strip_players }}"
conditions:
  - alias: The event is from the selected mixer
    condition: template
    value_template: "{{ trigger.id not in ['midi', 'sync_bridge'] or from_bridge }}"
actions:
  - alias: Log the event
    if:
      - condition: template
        value_template: "{{ log_events and trigger.id == 'midi' and control != '' }}"
    then:
      - action: system_log.write
        data:
          level: info
          logger: homeassistant.blueprints.ha_midi_smc_mixer
          message: "{{ control_name }}: {{ payload }}"

  - alias: Fader sets light attribute
    if:
      - condition: template
        value_template: >-
          {{ trigger.id == 'midi' and fader_function != 'none'
             and strip_lights | length > 0
             and (fader_function == 'auto' or fader_function in light_functions) }}
    then:
      - alias: Wait for the next sampling point
        delay:
          milliseconds: "{{ fader_debounce - ((as_timestamp(now()) * 1000) | int % fader_debounce) }}"
      - variables:
          light_function: "{{ 'brightness' if fader_function == 'auto' else fader_function }}"
          fader_current: >-
            {{ fader_entity == '' or not (states(fader_entity) | is_number)
               or states(fader_entity) | float == fader_value }}
      - if:
          - condition: template
            value_template: "{{ fader_current }}"
        then:
          - repeat:
              for_each: "{{ strip_lights }}"
              sequence:
                - choose:
                    - conditions: "{{ light_function == 'brightness' and fader_value <= 0 }}"
                      sequence:
                        - action: light.turn_off
                          continue_on_error: true
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            transition: 0
                    - conditions: "{{ light_function == 'brightness' }}"
                      sequence:
                        - action: light.turn_on
                          continue_on_error: true
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            brightness_pct: "{{ [fader_value | round(0) | int, 1] | max }}"
                            transition: 0
                    - conditions: "{{ light_function == 'colour_temp' }}"
                      sequence:
                        - action: light.turn_on
                          continue_on_error: true
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            color_temp_kelvin: >-
                              {% set low = state_attr(repeat.item, 'min_color_temp_kelvin') | int(2000) %}
                              {% set high = state_attr(repeat.item, 'max_color_temp_kelvin') | int(6500) %}
                              {{ (low + (high - low) * fader_value / 100) | round(0) | int }}
                            transition: 0
                    - conditions: "{{ light_function == 'colour_temp_rgb' }}"
                      sequence:
                        - action: light.turn_on
                          continue_on_error: true
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            rgb_color: >-
                              {% set low = state_attr(repeat.item, 'min_color_temp_kelvin') | int(2000) %}
                              {% set high = state_attr(repeat.item, 'max_color_temp_kelvin') | int(6500) %}
                              {% set t = (low + (high - low) * fader_value / 100) / 100.0 %}
                              {% set r = 255 if t <= 66 else 329.698727446 * ((t - 60) ** -0.1332047592) %}
                              {% set g = (99.4708025861 * (t | log) - 161.1195681661) if t <= 66 else (288.1221695283 * ((t - 60) ** -0.0755148492)) %}
                              {% set b = 255 if t >= 66 else (0 if t <= 19 else (138.5177312231 * ((t - 10) | log) - 305.0447927307)) %}
                              {{ [ [[r, 0] | max, 255] | min | round(0) | int,
                                   [[g, 0] | max, 255] | min | round(0) | int,
                                   [[b, 0] | max, 255] | min | round(0) | int ] }}
                            transition: 0
                    - conditions: "{{ light_function == 'hue' }}"
                      sequence:
                        - action: light.turn_on
                          continue_on_error: true
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            hs_color:
                              - "{{ (fader_value * 3.6) | round(1) }}"
                              - "{{ ((state_attr(repeat.item, 'hs_color') or [0, 100])[1]) | float(100) }}"
                            transition: 0
                    - conditions: "{{ light_function == 'saturation' }}"
                      sequence:
                        - action: light.turn_on
                          continue_on_error: true
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            hs_color:
                              - "{{ ((state_attr(repeat.item, 'hs_color') or [0, 100])[0]) | float(0) }}"
                              - "{{ fader_value }}"
                            transition: 0

  - alias: Fader ramps media player volume
    if:
      - condition: template
        value_template: >-
          {{ trigger.id == 'midi' and fader_function in ['auto', 'volume']
             and strip_players | length > 0 }}
    then:
      - alias: Wait for the fader to settle
        delay:
          milliseconds: "{{ fader_debounce }}"
      - variables:
          fader_moved: >-
            {{ fader_entity != '' and states(fader_entity) | is_number
               and states(fader_entity) | float != fader_value }}
      - if:
          - condition: template
            value_template: "{{ not fader_moved }}"
        then:
          - variables:
              volume_target: "{{ [[fader_value, 100] | min, 0] | max / 100 * volume_cap / 100 }}"
              ramp_plan: >-
                {% set ns = namespace(plan=[]) %}
                {% for player in strip_players %}
                {% set current = state_attr(player, 'volume_level') %}
                {% if current is number %}
                {% set rising = volume_target > current %}
                {% set step = [(volume_rise_rate if rising else volume_fall_rate) | float(1) / 100 * ramp_interval, 0.0001] | max %}
                {% set ns.plan = ns.plan + [{'entity': player, 'start': current, 'step': step if rising else -step, 'count': ((((volume_target - current) | abs) / step) - 0.001) | round(0, 'ceil') | int}] %}
                {% endif %}
                {% endfor %}
                {{ ns.plan }}
              ramp_iterations: >-
                {{ (ramp_plan | map(attribute='count') | list | max) if ramp_plan | length > 0 else 0 }}
          - repeat:
              sequence:
                - variables:
                    ramp_k: "{{ repeat.index }}"
                    ramp_moved: >-
                      {{ fader_entity != '' and states(fader_entity) | is_number
                         and states(fader_entity) | float != fader_value }}
                - if:
                    - condition: template
                      value_template: "{{ not ramp_moved }}"
                  then:
                    - repeat:
                        for_each: "{{ ramp_plan }}"
                        sequence:
                          - if:
                              - condition: template
                                value_template: "{{ ramp_k <= repeat.item.count }}"
                            then:
                              - action: media_player.volume_set
                                continue_on_error: true
                                target:
                                  entity_id: "{{ repeat.item.entity }}"
                                data:
                                  volume_level: >-
                                    {% set level = repeat.item.start + repeat.item.step * ramp_k %}
                                    {{ ([level, volume_target] | min if repeat.item.step > 0 else [level, volume_target] | max) | round(4) }}
                    - delay:
                        seconds: "{{ ramp_interval }}"
              until: >-
                {{ repeat.index >= ramp_iterations
                   or (fader_entity != '' and states(fader_entity) | is_number
                       and states(fader_entity) | float != fader_value) }}

  - alias: Dial steps light attribute
    if:
      - condition: template
        value_template: >-
          {{ trigger.id == 'midi' and dial_function != 'none'
             and strip_lights | length > 0
             and (dial_function == 'auto' or dial_function in light_functions) }}
    then:
      - variables:
          dial_run_ts: "{{ as_timestamp(state_attr(this.entity_id, 'last_triggered')) }}"
      - alias: Wait for the next dial sampling point
        delay:
          milliseconds: "{{ dial_debounce - ((as_timestamp(now()) * 1000) | int % dial_debounce) }}"
      - variables:
          dial_current: "{{ as_timestamp(state_attr(this.entity_id, 'last_triggered')) == dial_run_ts }}"
      - if:
          - condition: template
            value_template: "{{ dial_current }}"
        then:
          - variables:
              dial_dir: "{{ 1 if payload | int(0) < 64 else -1 }}"
              dial_ticks: "{{ payload | int(0) % 64 }}"
              light_function: "{{ 'brightness' if dial_function == 'auto' else dial_function }}"
              dial_pct: "{{ dial_ticks * dial_dir * light_dial_step }}"
          - choose:
              - conditions: "{{ light_function == 'brightness' }}"
                sequence:
                  - action: light.turn_on
                    continue_on_error: true
                    target:
                      entity_id: "{{ strip_lights }}"
                    data:
                      brightness_step_pct: "{{ dial_pct }}"
                      transition: 0
            default:
              - repeat:
                  for_each: "{{ strip_lights }}"
                  sequence:
                    - choose:
                        - conditions: "{{ light_function == 'colour_temp' }}"
                          sequence:
                            - action: light.turn_on
                              continue_on_error: true
                              target:
                                entity_id: "{{ repeat.item }}"
                              data:
                                color_temp_kelvin: >-
                                  {% set low = state_attr(repeat.item, 'min_color_temp_kelvin') | int(2000) %}
                                  {% set high = state_attr(repeat.item, 'max_color_temp_kelvin') | int(6500) %}
                                  {# A light reports color_temp_kelvin only in colour temperature mode. An RGB or
                                     RGBW light does not, so the temperature is recovered from rgb_color by
                                     inverting the formula that Home Assistant uses to convert kelvin to RGB. #}
                                  {% set measured = state_attr(repeat.item, 'color_temp_kelvin') %}
                                  {% set rgb = state_attr(repeat.item, 'rgb_color') %}
                                  {% if measured is number %}
                                    {% set current = measured %}
                                  {% elif rgb is not none and rgb | length == 3 and rgb | max > 0 %}
                                    {% set top = rgb | max %}
                                    {% set red = [rgb[0] * 255 / top, 1] | max %}
                                    {% set blue = rgb[2] * 255 / top %}
                                    {% if blue >= red %}
                                      {% set current = 100 * ((red / 329.698727446) ** (-1 / 0.1332047592) + 60) %}
                                    {% else %}
                                      {% set current = 100 * (e ** ((blue + 305.0447927307) / 138.5177312231) + 10) %}
                                    {% endif %}
                                  {% else %}
                                    {% set current = low %}
                                  {% endif %}
                                  {{ [[current + (high - low) * dial_pct / 100, low] | max, high] | min | round(0) | int }}
                                transition: 0
                        - conditions: "{{ light_function == 'colour_temp_rgb' }}"
                          sequence:
                            - action: light.turn_on
                              continue_on_error: true
                              target:
                                entity_id: "{{ repeat.item }}"
                              data:
                                rgb_color: >-
                                  {% set low = state_attr(repeat.item, 'min_color_temp_kelvin') | int(2000) %}
                                  {% set high = state_attr(repeat.item, 'max_color_temp_kelvin') | int(6500) %}
                                  {% set rgb = state_attr(repeat.item, 'rgb_color') %}
                                  {% set measured = state_attr(repeat.item, 'color_temp_kelvin') %}
                                  {% if rgb is not none and rgb | length == 3 and rgb | max > 0 %}
                                    {% set top = rgb | max %}
                                    {% set red = [rgb[0] * 255 / top, 1] | max %}
                                    {% set blue = rgb[2] * 255 / top %}
                                    {% if blue >= red %}
                                      {% set current = 100 * ((red / 329.698727446) ** (-1 / 0.1332047592) + 60) %}
                                    {% else %}
                                      {% set current = 100 * (e ** ((blue + 305.0447927307) / 138.5177312231) + 10) %}
                                    {% endif %}
                                  {% elif measured is number %}
                                    {% set current = measured %}
                                  {% else %}
                                    {% set current = low %}
                                  {% endif %}
                                  {% set t = ([[current + (high - low) * dial_pct / 100, low] | max, high] | min) / 100.0 %}
                                  {% set r = 255 if t <= 66 else 329.698727446 * ((t - 60) ** -0.1332047592) %}
                                  {% set g = (99.4708025861 * (t | log) - 161.1195681661) if t <= 66 else (288.1221695283 * ((t - 60) ** -0.0755148492)) %}
                                  {% set b = 255 if t >= 66 else (0 if t <= 19 else (138.5177312231 * ((t - 10) | log) - 305.0447927307)) %}
                                  {{ [ [[r, 0] | max, 255] | min | round(0) | int,
                                       [[g, 0] | max, 255] | min | round(0) | int,
                                       [[b, 0] | max, 255] | min | round(0) | int ] }}
                                transition: 0
                        - conditions: "{{ light_function == 'hue' }}"
                          sequence:
                            - action: light.turn_on
                              continue_on_error: true
                              target:
                                entity_id: "{{ repeat.item }}"
                              data:
                                hs_color:
                                  - >-
                                    {{ (((state_attr(repeat.item, 'hs_color') or [0, 100])[0] | float(0) + 3.6 * dial_pct) % 360) | round(1) }}
                                  - "{{ ((state_attr(repeat.item, 'hs_color') or [0, 100])[1]) | float(100) }}"
                                transition: 0
                        - conditions: "{{ light_function == 'saturation' }}"
                          sequence:
                            - action: light.turn_on
                              continue_on_error: true
                              target:
                                entity_id: "{{ repeat.item }}"
                              data:
                                hs_color:
                                  - "{{ ((state_attr(repeat.item, 'hs_color') or [0, 100])[0]) | float(0) }}"
                                  - >-
                                    {{ [[(state_attr(repeat.item, 'hs_color') or [0, 100])[1] | float(100) + dial_pct, 0] | max, 100] | min | round(1) }}
                                transition: 0

  - alias: Dial and Up and Down keys step media player volume
    if:
      - condition: template
        value_template: >-
          {{ trigger.id == 'midi' and volume_step_dir != 0
             and volume_step_players | length > 0
             and (control in ['up', 'down'] or dial_function != 'none') }}
    then:
      - repeat:
          for_each: "{{ volume_step_players }}"
          sequence:
            - variables:
                current: "{{ state_attr(repeat.item, 'volume_level') }}"
                next_level: >-
                  {% if current is not number %}{{ none }}
                  {% elif volume_step_dir > 0 %}
                  {{ [current + volume_step_ticks * volume_step_up / 100, [current, volume_cap / 100] | max] | min | round(4) }}
                  {% else %}
                  {{ [current - volume_step_ticks * volume_step_down / 100, 0] | max | round(4) }}
                  {% endif %}
            - if:
                - condition: template
                  value_template: "{{ current is number and next_level != current }}"
              then:
                - action: media_player.volume_set
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    volume_level: "{{ next_level }}"

  - alias: Strip keys control lights
    if:
      - condition: template
        value_template: "{{ pressed and strip_key != '' and strip_lights | length > 0 }}"
    then:
      - choose:
          - conditions: "{{ strip_key == 'select' }}"
            sequence:
              - action: light.toggle
                continue_on_error: true
                target:
                  entity_id: "{{ strip_lights }}"
          - conditions: "{{ strip_key == 'solo' }}"
            sequence:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: "{{ strip_lights }}"
                data:
                  brightness_pct: 100
          - conditions: "{{ strip_key == 'mute' }}"
            sequence:
              - action: light.turn_off
                continue_on_error: true
                target:
                  entity_id: "{{ strip_lights }}"
          - conditions: "{{ strip_key == 'rec' }}"
            sequence:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: "{{ strip_lights }}"
                data:
                  brightness_pct: "{{ night_brightness }}"

  - alias: Strip keys control media players
    if:
      - condition: template
        value_template: "{{ pressed and strip_key != '' and strip_players | length > 0 }}"
    then:
      - choose:
          - conditions: "{{ strip_key == 'select' }}"
            sequence:
              - action: media_player.media_play_pause
                continue_on_error: true
                target:
                  entity_id: "{{ strip_players }}"
          - conditions: "{{ strip_key == 'solo' }}"
            sequence:
              - action: media_player.media_next_track
                continue_on_error: true
                target:
                  entity_id: "{{ strip_players }}"
          - conditions: "{{ strip_key == 'rec' }}"
            sequence:
              - action: media_player.media_previous_track
                continue_on_error: true
                target:
                  entity_id: "{{ strip_players }}"
          - conditions: "{{ strip_key == 'mute' }}"
            sequence:
              - repeat:
                  for_each: "{{ strip_players }}"
                  sequence:
                    - action: media_player.volume_mute
                      continue_on_error: true
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        is_volume_muted: "{{ not is_state_attr(repeat.item, 'is_volume_muted', true) }}"

  - alias: Transport keys control media players
    if:
      - condition: template
        value_template: >-
          {{ pressed and control in transport_keys
             and control not in ['up', 'down']
             and (media_players | length > 0 or record_players | length > 0) }}
    then:
      - choose:
          - conditions: "{{ control == 'play' and media_players | length > 0 }}"
            sequence:
              - action: media_player.media_play
                continue_on_error: true
                target:
                  entity_id: "{{ media_players }}"
          - conditions: "{{ control == 'stop' and media_players | length > 0 }}"
            sequence:
              - action: media_player.media_pause
                continue_on_error: true
                target:
                  entity_id: "{{ media_players }}"
          - conditions: "{{ control == 'record' and record_players | length > 0 }}"
            sequence:
              - action: media_player.media_play_pause
                continue_on_error: true
                target:
                  entity_id: "{{ record_players }}"
          - conditions: "{{ control == 'left' and media_players | length > 0 }}"
            sequence:
              - action: media_player.media_previous_track
                continue_on_error: true
                target:
                  entity_id: "{{ media_players }}"
          - conditions: "{{ control == 'right' and media_players | length > 0 }}"
            sequence:
              - action: media_player.media_next_track
                continue_on_error: true
                target:
                  entity_id: "{{ media_players }}"
          - conditions: "{{ control in ['rewind', 'fast_forward'] }}"
            sequence:
              - repeat:
                  for_each: "{{ media_players }}"
                  sequence:
                    - variables:
                        seek_base: "{{ state_attr(repeat.item, 'media_position') }}"
                        seek_duration: "{{ state_attr(repeat.item, 'media_duration') }}"
                        seek_updated: "{{ state_attr(repeat.item, 'media_position_updated_at') }}"
                        seek_now: >-
                          {% if seek_base is number and is_state(repeat.item, 'playing') and seek_updated %}
                          {{ seek_base + (now() - as_datetime(seek_updated)).total_seconds() }}
                          {% else %}{{ seek_base }}{% endif %}
                        seek_target: >-
                          {% if seek_now is number %}
                          {% set moved = seek_now + (seek_seconds if control == 'fast_forward' else -seek_seconds) %}
                          {{ [[moved, 0] | max, seek_duration] | min if seek_duration is number else [moved, 0] | max }}
                          {% endif %}
                    - if:
                        - condition: template
                          value_template: "{{ seek_now is number }}"
                      then:
                        - action: media_player.media_seek
                          continue_on_error: true
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            seek_position: "{{ seek_target | round(1) }}"
          - conditions: "{{ control in ['bank_prev', 'bank_next'] }}"
            sequence:
              - repeat:
                  for_each: "{{ media_players }}"
                  sequence:
                    - variables:
                        source_list: "{{ state_attr(repeat.item, 'source_list') or [] }}"
                        source_now: "{{ state_attr(repeat.item, 'source') }}"
                        source_step: "{{ 1 if control == 'bank_next' else -1 }}"
                        source_next: >-
                          {% set count = source_list | length %}
                          {% if count == 0 %}
                          {% elif source_now in source_list %}{{ source_list[(source_list.index(source_now) + source_step) % count] }}
                          {% else %}{{ source_list[0] if source_step > 0 else source_list[count - 1] }}{% endif %}
                    - if:
                        - condition: template
                          value_template: "{{ source_next | string | length > 0 }}"
                      then:
                        - action: media_player.select_source
                          continue_on_error: true
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            source: "{{ source_next }}"

  - alias: Update key lights
    if:
      - condition: template
        value_template: >-
          {{ (trigger.id.startswith('led_') or trigger.id.startswith('sync_'))
             and bridge_prefix | length > 0
             and (trigger.id in ['sync_start', 'sync_bridge']
                  or (trigger.from_state is not none
                      and trigger.to_state is not none
                      and (trigger.from_state.state != trigger.to_state.state
                           or trigger.from_state.attributes.is_volume_muted
                              != trigger.to_state.attributes.is_volume_muted))) }}
    then:
      - variables:
          led_updates: >-
            {% set ns = namespace(items=[]) %}
            {% if trigger.id in ['sync_start', 'sync_bridge', 'led_media'] %}
            {% set playing = media_players | select('is_state', 'playing') | list | length > 0 %}
            {% set record_playing = record_players | select('is_state', 'playing') | list | length > 0 %}
            {% set ns.items = ns.items + [{'note': 94, 'on': playing}, {'note': 93, 'on': not playing}, {'note': 95, 'on': record_playing}] %}
            {% endif %}
            {% for n in range(1, 9) %}
            {% if trigger.id in ['sync_start', 'sync_bridge'] or trigger.id == 'led_strip_' ~ n %}
            {% set targets = strips[n - 1].targets | default([], true) %}
            {% set lights = targets | select('match', '^light[.]') | list %}
            {% set players = targets | select('match', '^media_player[.]') | list %}
            {% set lights_on = lights | select('is_state', 'on') | list | length %}
            {% set selected = lights_on > 0 or (players | select('is_state', 'playing') | list | length > 0) %}
            {% set muted = (players | select('is_state_attr', 'is_volume_muted', true) | list | length > 0) or (lights | length > 0 and lights_on == 0) %}
            {% set ns.items = ns.items + [{'note': 23 + n, 'on': selected}, {'note': 15 + n, 'on': muted}] %}
            {% endif %}
            {% endfor %}
            {{ ns.items }}
      - repeat:
          for_each: "{{ led_updates }}"
          sequence:
            - action: mqtt.publish
              continue_on_error: true
              data:
                topic: "{{ bridge_prefix }}/button_light_{{ '%03d' | format(repeat.item.note) }}_00/set"
                payload: "{{ 'ON' if repeat.item.on else 'OFF' }}"
