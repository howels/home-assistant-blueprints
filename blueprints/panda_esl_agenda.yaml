  max_items: !input max_items
  icon_style: !input icon_style
  use_emoji: "{{ icon_style == 'emoji' }}"
  text_font: !input text_font
  bold_font: !input bold_font

triggers:
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id: !input calendars
    id: change
  - trigger: state
    entity_id: !input todo_entities
    id: change
  - trigger: time_pattern
    minutes: !input update_minutes
  - trigger: state
    entity_id: !input force_entities
    id: force

actions:
  - if:
      - condition: trigger
        id: change
    then:
      - delay:
          seconds: !input settle_seconds
  - action: calendar.get_events
    target:
      entity_id: !input calendars
    data:
      start_date_time: "{{ now().isoformat() }}"
      end_date_time: "{{ (today_at() + timedelta(days=(days_ahead | int) + 1)).isoformat() }}"
    response_variable: calendar_response
    continue_on_error: true
  - action: todo.get_items
    target:
      entity_id: !input todo_entities
    data:
      status: needs_action
    response_variable: todo_response
    continue_on_error: true
  - condition: template
    value_template: "{{ calendar_response is defined or todo_response is defined }}"
  - variables:
      W: "{{ display_size.split('x')[0] | int }}"
      H: "{{ display_size.split('x')[1] | int }}"
      events: >-
        {% set ns = namespace(rows=[]) %}
        {% for entity, body in (calendar_response | default({}, true)).items() %}
          {% for e in (body or {}).get('events') or [] %}
            {% set all_day = (e.start | string) | length == 10 %}
            {% set s = as_local(as_datetime(e.start ~ ' 00:00:00' if all_day else e.start)) %}
            {% set days = [(s.date() - now().date()).days, 0] | max %}
            {% if all_day %}
              {% set label = 'Today' if days == 0 else (s.strftime('%a') if days < 7 else s.strftime('%a %d')) %}
            {% elif s <= now() %}
              {% set label = 'Now' %}
            {% elif days == 0 %}
              {% set label = s.strftime('%H:%M') %}
            {% else %}
              {% set label = s.strftime('%a %H:%M') %}
            {% endif %}
            {% set raw = e.get('summary') or '' %}
            {% set ns.rows = ns.rows + [{
              'ts': as_timestamp(s), 'lead': label, 'lead_red': days == 0,
              'task': false, 'raw': raw,
              'summary': (raw | regex_replace(strip_pattern, '') | regex_replace('\\s{2,}', ' ')) | trim
            }] %}
          {% endfor %}
        {% endfor %}
        {{ ns.rows | sort(attribute='ts') }}
      tasks: >-
        {% set ns = namespace(rows=[]) %}
        {% for entity, body in (todo_response | default({}, true)).items() %}
          {% for it in (body or {}).get('items') or [] %}
            {% set due = as_datetime(it.get('due')) if it.get('due') else none %}
            {% set days = (as_local(due).date() - now().date()).days if due is not none else none %}
            {% if days is none or days == 0 %}
              {% set due_text = '' %}
            {% elif days < 0 or days > 6 %}
              {% set due_text = as_local(due).strftime('%a %d') %}
            {% else %}
              {% set due_text = as_local(due).strftime('%a') %}
            {% endif %}
            {% if days is none or days <= (days_ahead | int) %}
            {% set raw = it.get('summary') or '' %}
            {% set ns.rows = ns.rows + [{
              'ts': as_timestamp(due) if due is not none else 4102444800, 'lead': due_text,
              'lead_red': days is not none and days < 0,
              'task': true, 'raw': raw,
              'summary': (raw | regex_replace(strip_pattern, '') | regex_replace('\\s{2,}', ' ')) | trim
            }] %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {{ ns.rows | sort(attribute='ts') }}
      pad: "{{ (W * 0.03) | round(0) | int }}"
      header_h: "{{ (H * 0.13) | round(0) | int }}"
      header_size: "{{ (header_h * 0.62) | round(0) | int }}"
      glyph_size: "{{ (header_h * 0.74) | round(0) | int }}"
      row_h: "{{ (H * 0.12) | round(0) | int }}"
      size: "{{ (row_h * 0.66) | round(0) | int }}"
      box: "{{ (row_h * 0.50) | round(0) | int }}"
      emoji_size: "{{ [[((row_h * 0.7) | round(0) | int) // 2 * 2, 10] | max, 36] | min }}"
      gap: "{{ [3, (W * 0.012) | round(0) | int] | max }}"
      body_top: "{{ header_h + 3 }}"
      fit: "{{ ((H - body_top) / row_h) | int }}"
      rows: "{{ [fit, max_items | int] | min }}"
      total: "{{ events | count + tasks | count }}"
      overflow: "{{ total > rows }}"
      shown: "{{ rows - 1 if overflow else rows }}"
      ev_show: "{{ [events | count, [shown - (tasks | count), (shown + 1) // 2] | max] | min }}"
      tk_show: "{{ [tasks | count, shown - ev_show] | min }}"
      chosen: "{{ events[:ev_show] + tasks[:tk_show] }}"
      ev_chars: >-
        {{ [events[:ev_show] | map(attribute='lead') | map('length') | max, 4] | max if ev_show > 0 else 0 }}
      tk_chars: >-
        {{ [tasks[:tk_show] | map(attribute='lead') | map('length') | max, 4] | max if tk_show > 0 and (tasks[:tk_show] | selectattr('lead') | list | count) > 0 else 0 }}
      ev_text_x: "{{ (pad + ev_chars * 0.58 * size + gap) | round(0) | int if ev_show > 0 else pad }}"
      tk_text_x: "{{ (pad + box + gap + (tk_chars * 0.58 * size + gap if tk_chars > 0 else 0)) | round(0) | int }}"
      date_text: "{{ now().strftime('%a %d %b') }}"
      payload: >-
        {% set ns = namespace(p=[], slot=0, spare=([rows - total, 0] | max), div=false) %}
        {% set ns.p = ns.p + [{
          'type': 'rectangle', 'x_start': 0, 'y_start': 0, 'x_end': W - 1, 'y_end': header_h,
          'fill': 'black', 'outline': 'black'
        }] %}
        {% if use_emoji %}
          {% set gy = ((header_h - glyph_size) / 2) | round(0) | int %}
          {% set ns.p = ns.p + [{
            'type': 'rectangle', 'x_start': pad, 'y_start': gy, 'x_end': pad + glyph_size,
            'y_end': gy + glyph_size, 'fill': 'white', 'outline': 'white'
          }, {
            'type': 'dlimg', 'url': emoji_image_url.replace('{code}', '1F4C5'), 'x': pad, 'y': gy,
            'xsize': glyph_size, 'ysize': glyph_size
          }] %}
        {% else %}
          {% set ns.p = ns.p + [{
            'type': 'icon', 'value': 'calendar-check', 'x': pad + (glyph_size / 2) | round(0) | int,
            'y': (header_h / 2) | round(0) | int, 'size': glyph_size, 'color': 'white', 'anchor': 'mm'
          }] %}
        {% endif %}
        {% set title_max = ((W - 2 * pad - glyph_size - ((date_text | length) + 2) * 0.55 * header_size) / (0.6 * header_size)) | int %}
        {% set ns.p = ns.p + [{
          'type': 'text', 'value': title if title | length <= title_max else (title[:title_max - 1] | trim) ~ '…',
          'x': pad + glyph_size + pad, 'y': (header_h / 2) | round(0) | int, 'size': header_size,
          'color': 'white', 'anchor': 'lm', 'font': bold_font
        }, {
          'type': 'text', 'value': date_text, 'x': W - pad, 'y': (header_h / 2) | round(0) | int,
          'size': header_size, 'color': 'white', 'anchor': 'rm', 'font': text_font
        }] %}
        {% if total == 0 %}
          {% if use_emoji %}
            {% set es = (H * 0.30) | round(0) | int %}
            {% set ns.p = ns.p + [{
              'type': 'dlimg', 'url': emoji_image_url.replace('{code}', '2705'), 'x': ((W - es) / 2) | round(0) | int,
              'y': (header_h + (H - header_h) * 0.40 - es / 2) | round(0) | int,
              'xsize': es, 'ysize': es
            }] %}
          {% else %}
            {% set ns.p = ns.p + [{
              'type': 'icon', 'value': 'check-circle-outline', 'x': (W / 2) | round(0) | int,
              'y': (header_h + (H - header_h) * 0.40) | round(0) | int,
              'size': (H * 0.30) | round(0) | int, 'color': 'black', 'anchor': 'mm'
            }] %}
          {% endif %}
          {% set ns.p = ns.p + [{
            'type': 'text', 'value': 'Nothing planned', 'x': (W / 2) | round(0) | int,
            'y': (header_h + (H - header_h) * 0.80) | round(0) | int,
            'size': (size * 1.2) | round(0) | int, 'color': 'black', 'anchor': 'mm', 'font': bold_font
          }] %}
        {% endif %}
        {% for r in chosen %}
          {% if r.task and not ns.div and ev_show > 0 %}
            {% set ns.div = true %}
            {% set ns.p = ns.p + [{
              'type': 'line', 'x_start': pad, 'x_end': W - pad - 1,
              'y_start': body_top + ns.slot * row_h, 'y_end': body_top + ns.slot * row_h,
              'fill': 'black', 'width': 1
            }] %}
          {% endif %}
          {% set y = (body_top + (ns.slot + 0.5) * row_h) | round(0) | int %}
          {% set ems = (r.raw | regex_findall(supported_emoji))[:3] if emoji_mode == 'image' else [] %}
          {% set text_x = tk_text_x if r.task else ev_text_x %}
          {% set tx = text_x + ems | count * emoji_size + (3 if ems else 0) %}
          {% set mc = ((W - tx - pad) / (0.5 * size)) | int %}
          {% set line1 = r.summary %}
          {% set line2 = '' %}
          {% if r.summary | length > mc and ns.spare > 0 %}
            {% set w = namespace(a='', b='', done=false) %}
            {% for word in r.summary.split(' ') %}
              {% if not w.done and ((w.a ~ ' ' ~ word) | trim | length) <= mc %}
                {% set w.a = (w.a ~ ' ' ~ word) | trim %}
              {% else %}
                {% set w.done = true %}
                {% set w.b = (w.b ~ ' ' ~ word) | trim %}
              {% endif %}
            {% endfor %}
            {% if w.a and w.b %}
              {% set line1 = w.a %}
              {% set line2 = w.b %}
              {% set ns.spare = ns.spare - 1 %}
            {% endif %}
          {% endif %}
          {% if r.task %}
            {% set ns.p = ns.p + [{
              'type': 'rectangle', 'x_start': pad, 'y_start': y - (box / 2) | round(0) | int,
              'x_end': pad + box, 'y_end': y + (box / 2) | round(0) | int,
              'outline': 'black', 'fill': 'white', 'width': 2
            }] %}
            {% if r.lead %}
              {% set ns.p = ns.p + [{
                'type': 'text', 'value': r.lead, 'x': pad + box + gap, 'y': y, 'size': size,
                'color': 'red' if r.lead_red else 'black', 'anchor': 'lm', 'font': bold_font
              }] %}
            {% endif %}
          {% else %}
            {% set ns.p = ns.p + [{
              'type': 'text', 'value': r.lead, 'x': pad, 'y': y, 'size': size,
              'color': 'red' if r.lead_red else 'black', 'anchor': 'lm', 'font': bold_font
            }] %}
          {% endif %}
          {% set ns.p = ns.p + [{
            'type': 'text', 'value': line1 if line1 | length <= mc else (line1[:mc - 1] | trim) ~ '…',
            'x': tx, 'y': y, 'size': size, 'color': 'black', 'anchor': 'lm', 'font': text_font
          }] %}
          {% if line2 %}
            {% set ns.p = ns.p + [{
              'type': 'text', 'value': line2 if line2 | length <= mc else (line2[:mc - 1] | trim) ~ '…',
              'x': tx, 'y': y + row_h, 'size': size, 'color': 'black', 'anchor': 'lm', 'font': text_font
            }] %}
          {% endif %}
          {% for ch in ems %}
            {% set code = ch.encode('utf-32-be').hex() | upper | regex_replace('^0+', '') %}
            {% set shape = dither_shapes.get(code) if dither_brown else none %}
            {% set ns.p = ns.p + [{
              'type': 'dlimg', 'url': dither_png[shape][emoji_size | string] if shape else emoji_image_url.replace('{code}', code),
              'x': text_x + loop.index0 * emoji_size,
              'y': y - (emoji_size / 2) | round(0) | int, 'xsize': emoji_size, 'ysize': emoji_size
            }] %}
          {% endfor %}
          {% set ns.slot = ns.slot + (2 if line2 else 1) %}
        {% endfor %}
        {% if overflow %}
          {% set ns.p = ns.p + [{
            'type': 'text', 'value': '+' ~ (total - ev_show - tk_show) ~ ' more', 'x': pad,
            'y': (body_top + (ns.slot + 0.5) * row_h) | round(0) | int, 'size': size,
            'color': 'red', 'anchor': 'lm', 'font': bold_font
          }] %}
        {% endif %}
        {{ ns.p }}
  - variables:
      payload_hash: "{{ (payload | to_json(sort_keys=True) | sha256)[:32] }}"
      force_write: "{{ force_push or (trigger.id | default('', true)) == 'force' }}"
      sent_hash: "{{ states(sent_helper) if sent_helper else '' }}"
      unchanged: >-
        {{ sent_helper != '' and not force_write and not dry_run and sent_hash == payload_hash }}
  - if:
      - condition: template
        value_template: "{{ unchanged }}"
    then:
      - stop: The payload matches the last write.
  - action: !input write_action
    target:
      device_id: !input display
    data:
      background: white
      dry_run: !input dry_run
      payload: "{{ payload }}"
  - if:
      - condition: template
        value_template: "{{ sent_helper != '' and not dry_run }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: "{{ sent_helper }}"
        data:
          value: "{{ payload_hash }}"
        continue_on_error: true

mode: restart
