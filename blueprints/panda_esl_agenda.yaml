blueprint:
  name: PANDA ESL agenda (calendar and to-do)
  author: howels
  domain: automation
  source_url: https://github.com/howels/home-assistant-blueprints/blob/main/blueprints/panda_esl_agenda.yaml
  description: >-
    Draws the coming calendar events and the open to-do items together on a
    PANDA / ETAG Bluetooth e-paper label. Requires the PANDA ESL integration
    (https://github.com/moryoav/ha-panda).


    calendar.get_events is called once for all selected calendars, from now
    until the end of the last day selected. todo.get_items is called once for
    all selected to-do entities and returns the items with status needs_action.
    The events come first, sorted by start time, then a divider line, then the
    open items, sorted by due date. Items with no due date follow the dated
    items. The rows are shared between the two lists. Each list keeps at least
    half of the rows when both are long, and a short list leaves its unused
    rows to the other. When more entries exist than rows fit, the last row
    reads "+N more".


    An event row has a time column and the summary. The time column shows the
    time for events today, Tom and the time for tomorrow, and the weekday and
    time for later days. All-day events show Today, Tomorrow, or the weekday.
    An event in progress shows Now. Events that start today are drawn in red.
    An item row has a checkbox, the summary, and the due date. A due date in
    the past is drawn in red with its date. Today and Tomorrow are written out.


    The automation runs at Home Assistant start, when a calendar or to-do
    entity changes state, and on the selected interval. A calendar entity
    changes state when an event starts or ends. The state of a to-do entity is
    its count of open items, so editing an item without changing the count is
    shown at the next interval. A state change starts a wait of the settle time,
    so a burst of edits is written once. The label is not written when both
    services fail. The write action and the dry run input behave as in the
    PANDA ESL weather display blueprint.


    Icon style emoji draws OpenMoji pictures for the header glyph and the
    markers. Emoji in the text are drawn the same way, up to three before each
    row. Each picture is a PNG that the integration downloads from the emoji
    image URL at every write, through the dlimg element. The renderer reduces
    the label to black, white, and red, so the red parts of a colour emoji stay
    red, the outlines turn black, and light fills turn white. Yellow is not
    available on this hardware and is drawn as red. Replace color with black in
    the URL for an all-black set. Copy the OpenMoji PNG folder to the Home
    Assistant host, or serve it from config/www, to avoid the download. Put
    {code} in the URL where the upper-case hexadecimal code point belongs.
    OpenMoji is licensed CC BY-SA 4.0. The brown circle and square are drawn
    as a checkerboard of red and black pixels, which reads as dark red on the
    label. The text font has no emoji glyphs, so the text is drawn with its
    emoji removed.
  input:
    display_section:
      name: Display
      icon: mdi:tag-text
      collapsed: false
      input:
        display:
          name: PANDA ESL label
          description: Label that receives the image.
          selector:
            device:
              integration: panda_esl
        display_size:
          name: Resolution
          description: >-
            Resolution of the label. ETAG-525 is 256 by 128, ETAG-526 is 296 by
            152, ETAG-530 is 360 by 240, and ETAG-534 is 400 by 300.
          default: 360x240
          selector:
            select:
              mode: dropdown
              options:
                - label: 256 x 128 (ETAG-525, 2.13 inch)
                  value: 256x128
                - label: 296 x 152 (ETAG-526, 2.66 inch)
                  value: 296x152
                - label: 360 x 240 (ETAG-530, 3.5 inch)
                  value: 360x240
                - label: 400 x 300 (ETAG-534, 4.2 inch)
                  value: 400x300
        write_action:
          name: Write action
          description: >-
            panda_esl.write_guarded applies the duplicate prevention, write
            lock, and debounce options of the integration. panda_esl.write
            always sends.
          default: panda_esl.write_guarded
          selector:
            select:
              mode: dropdown
              options:
                - label: Guarded write
                  value: panda_esl.write_guarded
                - label: Write
                  value: panda_esl.write
        dry_run:
          name: Dry run
          description: >-
            Renders to the Preview content image entity and does not send
            Bluetooth packets.
          default: false
          selector:
            boolean: {}
    sources_section:
      name: Calendars and to-do lists
      icon: mdi:calendar-check
      collapsed: false
      input:
        calendars:
          name: Calendars
          description: Calendars whose events are drawn.
          selector:
            entity:
              multiple: true
              filter:
                - domain: calendar
        todo_entities:
          name: To-do lists
          description: To-do lists whose open items are drawn.
          selector:
            entity:
              multiple: true
              filter:
                - domain: todo
        title:
          name: Title
          description: Header text.
          default: Agenda
          selector:
            text: {}
        days_ahead:
          name: Days ahead
          description: >-
            Days after today to include events from. 0 draws today only.
          default: 3
          selector:
            number:
              min: 0
              max: 14
              step: 1
              mode: box
        max_items:
          name: Maximum rows
          description: >-
            Upper limit on the rows of events and items together. The
            resolution also limits the rows. The 3.5 inch label fits 7 rows
            including the "+N more" row.
          default: 8
          selector:
            number:
              min: 1
              max: 12
              step: 1
              mode: box
        update_minutes:
          name: Update interval
          description: >-
            How often the label is refreshed, in addition to every event start
            and end and every change in the number of open items. Each refresh
            redraws the e-paper panel.
          default: "0"
          selector:
            select:
              mode: dropdown
              options:
                - label: Every hour
                  value: "0"
                - label: Every 30 minutes
                  value: /30
        settle_seconds:
          name: Settle time
          description: >-
            Wait after a change before the write. A further change in that time
            restarts the wait.
          default: 60
          selector:
            number:
              min: 0
              max: 600
              step: 5
              unit_of_measurement: s
              mode: box
    style_section:
      name: Style
      icon: mdi:palette
      collapsed: true
      input:
        icon_style:
          name: Icon style
          description: >-
            mdi draws a bundled Material Design Icon in the header. emoji draws
            an OpenMoji picture.
          default: mdi
          selector:
            select:
              mode: dropdown
              options:
                - label: Material Design Icons
                  value: mdi
                - label: Emoji
                  value: emoji
        emoji_image_url:
          name: Emoji image URL
          description: >-
            Address of one emoji PNG. {code} is replaced with the upper-case
            hexadecimal code point, for example 2600 for the sun. A file path
            works in the same form.
          default: https://cdn.jsdelivr.net/gh/hfg-gmuend/openmoji@15.1.0/color/72x72/{code}.png
          selector:
            text: {}
        emoji_mode:
          name: Emoji in text
          description: >-
            image draws up to three emoji from each row as pictures before the
            text. strip draws the text only. The emoji image URL must be
            reachable in image mode, or the write fails.
          default: image
          selector:
            select:
              mode: dropdown
              options:
                - label: Pictures
                  value: image
                - label: Strip
                  value: strip
        dither_brown:
          name: Dither brown emoji
          description: >-
            Draws the brown circle and the brown square as a checkerboard of
            red and black pixels with a black outline, which reads as dark red.
            Other emoji use the pictures from the emoji image URL.
          default: true
          selector:
            boolean: {}
        text_font:
          name: Text font
          description: Regular weight font for the summaries.
          default: fonts/NotoSansKR-Regular.ttf
          selector:
            text: {}
        bold_font:
          name: Bold font
          description: Bold weight font for the header, the time column, and the due dates.
          default: fonts/NotoSansKR-Bold.ttf
          selector:
            text: {}

variables:
  emoji_mode: !input emoji_mode
  emoji_image_url: !input emoji_image_url
  dither_brown: !input dither_brown
  dither_shapes:
    "1F7E4": disc
    "1F7EB": square
