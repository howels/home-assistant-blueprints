# Store for blueprints/room_occupancy.yaml.
#
# Add this item to the template: list in configuration.yaml, then reload
# template entities (Developer tools > YAML) or restart Home Assistant.
#
# The room_occupancy blueprint fires occupancy_room_update with data room
# (slug), and optionally snapshot, saved_at and vacated. Each event replaces
# those fields for that room and leaves the others unchanged.
#
# Home Assistant restores the state and attributes of a trigger-based template
# sensor after a restart, so the saved rooms survive it. It writes restore data
# every 15 minutes and on a clean stop.
- triggers:
    - trigger: event
      event_type: occupancy_room_update
  conditions:
    - condition: template
      value_template: "{{ trigger.event.data.get('room') is string }}"
  sensor:
    - name: Occupancy scene store
      unique_id: occupancy_scene_store
      icon: mdi:database-lock
      state: "{{ now().isoformat() }}"
      attributes:
        rooms: >-
          {% set d = trigger.event.data %}
          {% set rooms = this.attributes.get('rooms') or {} %}
          {% set old = rooms.get(d.room) or {} %}
          {% set new = {
            'snapshot': d.get('snapshot', {}) if 'snapshot' in d else old.get('snapshot', {}),
            'saved_at': d.get('saved_at', '') if 'snapshot' in d else old.get('saved_at', ''),
            'vacated': d.get('vacated', true) if 'vacated' in d else old.get('vacated', true)
          } %}
          {{ rooms | combine({d.room: new}) }}
